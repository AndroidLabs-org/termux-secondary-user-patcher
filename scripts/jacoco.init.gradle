// Adds JaCoCo to the unit tests of the patched Termux tree without touching upstream's build
// files. Used by scripts/coverage.sh through `gradlew -I`. Tied to the v0.118.3 toolchain
// (Gradle 7.2, AGP 4.2.2, JDK 11).
allprojects { p ->
    p.plugins.withId('com.android.application') { configureCoverage(p) }
    p.plugins.withId('com.android.library') { configureCoverage(p) }
}

def configureCoverage(p) {
    p.apply plugin: 'jacoco'
    p.jacoco { toolVersion = '0.8.7' }
    p.tasks.withType(Test).configureEach {
        // Robolectric loads classes through its own classloader; without these the agent sees nothing.
        jacoco.includeNoLocationClasses = true
        jacoco.excludes = ['jdk.internal.*']
    }
    p.afterEvaluate {
        if (p.tasks.findByName('testDebugUnitTest') == null) return
        p.tasks.register('stupJacocoReport', JacocoReport) {
            dependsOn 'testDebugUnitTest'
            executionData.setFrom(p.fileTree(dir: p.buildDir, includes: ['jacoco/testDebugUnitTest.exec']))
            classDirectories.setFrom(p.fileTree(dir: "${p.buildDir}/intermediates/javac/debug/classes",
                    excludes: ['**/R.class', '**/R$*.class', '**/BuildConfig.class']))
            sourceDirectories.setFrom(p.files('src/main/java'))
            reports {
                xml.required = true
                csv.required = true
                html.required = true
            }
        }
    }
}
